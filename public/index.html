<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI PDF RAG Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-box p {
            margin-bottom: 15px;
            color: #4b5563;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
        }

        .question-box {
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .answer-box {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #2563eb;
        }

        .answer-box h3 {
            margin-bottom: 10px;
            color: #1f2937;
        }

        #answer {
            color: #374151;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #6b7280;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .feature {
            background: #eff6ff;
            padding: 10px 15px;
            border-radius: 20px;
            color: #1d4ed8;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI PDF RAG Chatbot</h1>

    <p class="subtitle">
        Upload a PDF and ask questions using Retrieval-Augmented Generation
    </p>

    <div class="upload-box">

        <p>📄 Upload your PDF document</p>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf"
        >

    </div>

    <div class="question-box">

        <textarea
            id="question"
            placeholder="Ask a question about your PDF..."
        ></textarea>

        <button id="askButton" onclick="askQuestion()">
            Ask Question
        </button>

    </div>

    <div class="status" id="status"></div>

    <div class="answer-box">

        <h3>💡 Answer</h3>

        <div id="answer">
            Your answer will appear here.
        </div>

    </div>

    <div class="features">

        <div class="feature">📄 PDF Processing</div>

        <div class="feature">🔎 Semantic Search</div>

        <div class="feature">🧠 FAISS</div>

        <div class="feature">✨ Gemini AI</div>

    </div>

</div>


<script>

async function askQuestion() {

    const fileInput = document.getElementById("pdfFile");
    const questionInput = document.getElementById("question");
    const button = document.getElementById("askButton");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");

    const file = fileInput.files[0];
    const question = questionInput.value.trim();

    if (!file) {
        alert("Please upload a PDF first.");
        return;
    }

    if (!question) {
        alert("Please enter a question.");
        return;
    }

    const formData = new FormData();

    formData.append("file", file);
    formData.append("question", question);

    button.disabled = true;
    button.textContent = "Processing...";
    status.textContent = "🔄 Reading PDF and generating answer...";
    answer.textContent = "";

    try {

        const response = await fetch("/api/chat", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (data.error) {
            answer.textContent = "❌ " + data.error;
        } else {
            answer.textContent = data.answer;
        }

    } catch (error) {

        answer.textContent =
            "❌ Something went wrong. Please try again.";

        console.error(error);

    } finally {

        button.disabled = false;
        button.textContent = "Ask Question";
        status.textContent = "";

    }
}

</script>

</body>
</html>
